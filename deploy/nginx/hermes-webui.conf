# 参考配置（脱敏）：本文件是轻聊后端对外入口的 nginx 片段。
# ⚠️ 这是【参考】不是可直接用的部署件：证书路径、域名、端口需按本机实际情况改。
# ⚠️ 新增 API 路径时必须同步本目录全部三份，漏一份该入口就 404。
#    三份与入口的对应关系：qingliao_http.conf=16668 / webui_443.conf=443 /
#    hermes-webui.conf=8080（App 真实入口，经 Lucky 按域名整端口反代到这里）。
# ⚠️ hermes-webui.conf 里的 location /api/ 是【兜底】，转 9123(Hermes 网关) 而非轻聊后端 9127；
#    未单列的 /api/xxx 会落到 9123 得到 Go 风格 404。新增规则必须放在该兜底【之前】。

server {
    listen 8080;
    server_name _;

    root /volume1/docker/hermes/微信文件/轻聊web;
    index index.html;

    location /store/ {
        alias /volume1/docker/hermes/微信文件/store/;
        autoindex off;
        add_header Cache-Control "no-cache";
        types {
            application/json json;
            application/octet-stream ipa;
            image/png png;
        }
    }

    location / {
        try_files $uri $uri/ =404;
    }






    location /r {
        proxy_buffer_size 64k;
        proxy_buffers 8 64k;
        proxy_busy_buffers_size 128k;
        proxy_pass http://127.0.0.1:9132;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/inbox {
        proxy_pass http://127.0.0.1:9127;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/auth/ {
        proxy_pass http://127.0.0.1:9127;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/sessions/ {
        proxy_pass http://127.0.0.1:9127;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
        location /api/docker/  { proxy_pass http://127.0.0.1:9127; proxy_set_header Host $host; }
        location /api/channel/ { proxy_pass http://127.0.0.1:9127; proxy_set_header Host $host; }
    location /api/kb/  { proxy_pass http://127.0.0.1:9127; proxy_set_header Host $host; }
    location /api/hw/  { proxy_pass http://127.0.0.1:9127; proxy_set_header Host $host; }
    location /api/memory/  { proxy_pass http://127.0.0.1:9127; proxy_set_header Host $host; }
    location /api/weather  { proxy_pass http://127.0.0.1:9127; proxy_set_header Host $host; }
location /api/files/ {
        proxy_pass http://127.0.0.1:9127;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # 流式执行代理（后端持流）
    location /api/stream/ {
        proxy_pass http://127.0.0.1:9132;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/tts  { proxy_pass http://127.0.0.1:9132; proxy_set_header Host $host; }
location /api/logs/ {
        proxy_pass http://127.0.0.1:9127;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ha/ {
        proxy_pass http://127.0.0.1:9127;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/nas/ {
        proxy_pass http://127.0.0.1:9132;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
    }
    location /api/secrets { proxy_pass http://127.0.0.1:9127; proxy_set_header Host $host; }
    location /api/router/  { proxy_pass http://127.0.0.1:9127; proxy_set_header Host $host; }
    location /api/scenes { proxy_pass http://127.0.0.1:9127; }
    location /api/agent { proxy_pass http://127.0.0.1:9127; }
    location /api/history { proxy_pass http://127.0.0.1:9127; }
    location /api/automations { proxy_pass http://127.0.0.1:9127; }
    location /api/local { proxy_pass http://127.0.0.1:9127; }
    location /api/push { proxy_pass http://127.0.0.1:9127; }
    location /api/bots { proxy_pass http://127.0.0.1:9127; proxy_set_header Host $host; }
    location /api/mcp { proxy_pass http://127.0.0.1:9127; proxy_set_header Host $host; }
    location /api/diag { proxy_pass http://127.0.0.1:9127; proxy_set_header Host $host; }
    location /api/life { proxy_pass http://127.0.0.1:9127; proxy_set_header Host $host; }
    location /api/mail { proxy_pass http://127.0.0.1:9127; proxy_set_header Host $host; }
    location /api/version { proxy_pass http://127.0.0.1:9127; proxy_set_header Host $host; }  # v4.0.14 免鉴权后端版本信息
    location /api/clouddrive/ {
        proxy_pass http://127.0.0.1:9127;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_buffering off;
    }
    location /api/agent/ {
        proxy_pass http://127.0.0.1:9127;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_buffering off;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:9123/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
    }

    location /v1/ {
        proxy_pass http://127.0.0.1:9123;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
    }
    location /api/cron/ {
        proxy_pass http://127.0.0.1:9127/api/cron/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
